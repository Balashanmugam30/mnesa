services:
  # ==========================================
  # PostgreSQL (Primary Relational Database)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: mnesa-postgres-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mnesa_dev}
      POSTGRES_USER: ${POSTGRES_USER:-mnesa_dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mnesa_secure_dev_pass_2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mnesa_dev_user} -d ${POSTGRES_DB:-mnesa_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Valkey (In-Memory Cache & Session Store)
  # ==========================================
  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: mnesa-valkey-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:-valkey_secure_dev_pass_2026!}"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:-valkey_secure_dev_pass_2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MinIO (S3-Compatible Local Object Storage)
  # ==========================================
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: mnesa-minio-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_dev_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_dev_pass_2026!}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Apache Kafka (KRaft Mode - Scaled Streaming)
  # ==========================================
  kafka:
    image: apache/kafka:latest
    container_name: mnesa-kafka-dev
    restart: unless-stopped
    profiles:
      - streaming
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

volumes:
  postgres_data:
    name: mnesa_postgres_dev_data
  valkey_data:
    name: mnesa_valkey_dev_data
  minio_data:
    name: mnesa_minio_dev_data
  kafka_data:
    name: mnesa_kafka_dev_data
