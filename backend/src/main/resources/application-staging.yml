server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mnesa_staging}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:mnesa_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:mnesa_password}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mnesa:
  ai:
    service-url: ${MNESA_AI_SERVICE_URL:http://localhost:8001}
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:mnesa_staging_jwt_secret_key_minimum_256_bits_for_hmac_sha256!}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000} # 24 hours for staging
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000} # 30 days

logging:
  level:
    root: INFO
    com.mnesa.backend: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
