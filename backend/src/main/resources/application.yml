spring:
  application:
    name: mnesa-backend
  profiles:
    active: dev

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

mnesa:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:mnesa_dev_jwt_secret_key_minimum_256_bits_length_for_hmac_sha256_secure_2026!}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000} # 1 hour
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000} # 30 days

